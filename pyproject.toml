[project]
name = "pypostgres"
dynamic = ["version"]
description = "A thin psycopg2 wrapper with a PostgreSQL metadata and introspection toolkit"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bruno Almeida", email = "brunomgalmeida@gmail.com" }]
requires-python = ">=3.8"
dependencies = ["psycopg2-binary>=2.9.10"]
keywords = ["postgresql", "psycopg2", "database", "introspection", "partitioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
urls = { Homepage = "https://github.com/brunomgalmeida/pypostgres", Source = "https://github.com/brunomgalmeida/pypostgres", "Bug Tracker" = "https://github.com/brunomgalmeida/pypostgres/issues" }


[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test*.py"
# python_functions = "test_*"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[project.optional-dependencies]
dev = ["pytest>=8.3.5"]
notebook = []
timescale = []
all = ["hammertime[dev,notebook]"]

[project.scripts]
pypg-schema-sync = "pypostgres.tools.schema_sync:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# dirty trees and post-tag commits report the tag itself (0.0.2.dev1) instead of guessing the next minor
[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/pypostgres"]
