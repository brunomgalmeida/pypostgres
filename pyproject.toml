[project]
name = "pypostgres"
version = "0.0.1"
description = "pypostgres"
readme = "README.md"
authors = [{ name = "Bruno Almeida", email = "brunomgalmeida@gmail.com" }]
requires-python = ">=3.8"
dependencies = ["psycopg2-binary>=2.9.10"]


[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test*.py"
# python_functions = "test_*"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[project.optional-dependencies]
dev = ["pytest>=8.3.5"]
notebook = []
all = ["hammertime[dev,notebook]"]
